name: Build & Release Custom Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.2)'
        required: false
        default: 'v1.1.2'

permissions:
  contents: write

jobs:
  build:
    name: Build Firmware & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Zig Toolchain
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile C components and assemble firmware
        run: |
          python build.py --output FW_TV-IP121W_Custom_Pro_v1.1.2.pck

      - name: Compute SHA256 Checksums
        run: |
          sha256sum FW_TV-IP121W_Custom_Pro_v1.1.2.pck > checksums.sha256
          cat checksums.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-package
          path: |
            FW_TV-IP121W_Custom_Pro_v1.1.2.pck
            checksums.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: TRENDnet TV-IP121W Custom Pro ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            FW_TV-IP121W_Custom_Pro_v1.1.2.pck
            checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
